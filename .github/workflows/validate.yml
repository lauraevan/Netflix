name: Validate frontend
on:
  push:
  pull_request:
jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check native.js
          node --check config.js
          node --check tests/smoke.mjs
      - name: Check GitHack beta address
        run: |
          URL="https://raw.githack.com/lauraevan/Netflix/main/index.html"
          STATUS=$(curl --max-time 30 -L -sS -o /tmp/netflix-githack.html -w "%{http_code}" "$URL" || true)
          echo "GitHack status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            grep -q '<title>Netflix</title>' /tmp/netflix-githack.html
            echo "Verified GitHack is serving the Netflix app."
          else
            echo "GitHack may need time to refresh, or access is temporarily unavailable."
          fi
      - name: Check referenced HTML IDs
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text()
          js = pathlib.Path('app.js').read_text()
          existing = set(re.findall(r'\bid="([^"]+)"', html)) | set(re.findall(r'\.id="([^"]+)"', js))
          queried = set(re.findall(r'\$\("([A-Za-z][A-Za-z0-9]*)"\)', js))
          missing = queried - existing
          assert not missing, f'IDs referenced but absent in HTML: {sorted(missing)}'
          print(f'Validated {len(queried)} DOM ID references.')
          PY
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static frontend
        run: python3 -m http.server 8765 >/tmp/netflix-http.log 2>&1 &
      - name: Exercise desktop and mobile interface
        run: node tests/smoke.mjs
      - name: Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-screenshots
          path: |
            desktop-home.png
            mobile-home.png
            mobile-profiles.png
            mobile-details.png
            mobile-newhot.png
            mobile-mynetflix.png
            desktop-smoke.png
            mobile-smoke.png
          if-no-files-found: ignore
